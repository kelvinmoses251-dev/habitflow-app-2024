name: Daily Habit Reminders

on:
  schedule:
    # Runs every hour (GitHub cron is UTC). The script itself decides who is due: each user is reminded
    # in their own morning and evening, so the job has to look in on every timezone.
    - cron: '7 * * * *'
  # Allows you to trigger this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  send_reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'      # the job imports ../habit-rules.js, an ES module without a package.json: Node 22 loads that

      - name: Install Dependencies
        working-directory: ./scripts
        run: npm ci

      - name: Test Reminder Logic
        working-directory: ./scripts
        run: node --test reminder-logic.test.js ../tests/habit-rules.test.js

      - name: Run Reminder Script
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-reminders.js
