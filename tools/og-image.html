<!doctype html>
<!-- Source for og-image.png (the link-preview card). Regenerate with:
     msedge --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 --screenshot=og-image.png file:///.../tools/og-image.html -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #fff;
    background:
      radial-gradient(620px 420px at 88% 8%, rgba(249,115,22,.45), transparent 62%),
      radial-gradient(700px 520px at 0% 100%, rgba(99,102,241,.55), transparent 60%),
      linear-gradient(135deg, #4C1D95 0%, #6D28D9 48%, #7C3AED 100%);
    display: flex; align-items: center; padding: 0 84px; gap: 56px;
  }
  .left { flex: 1.15; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 34px; }
  .logo { width: 62px; height: 62px; border-radius: 16px; background: linear-gradient(135deg,#9333EA,#6366F1); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .logo svg { width: 36px; height: 36px; }
  .brand b { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  h1 { font-size: 84px; line-height: 1.02; font-weight: 800; letter-spacing: -.045em; }
  h1 em { font-style: normal; background: linear-gradient(100deg, #FDE68A, #FDBA74 50%, #FB923C); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: 26px; font-size: 29px; line-height: 1.4; font-weight: 500; color: rgba(255,255,255,.86); max-width: 560px; }
  .pill { display: inline-block; margin-top: 30px; padding: 12px 24px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1.5px solid rgba(255,255,255,.35); font-weight: 700; font-size: 22px; }

  .phone {
    flex: .85; background: #fff; color: #1A1535; border-radius: 36px; padding: 28px;
    box-shadow: 0 40px 90px rgba(0,0,0,.4), 0 0 0 10px rgba(255,255,255,.12); transform: rotate(3deg);
  }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .lv { font-weight: 800; font-size: 21px; }
  .streak { background: linear-gradient(135deg,#F97316,#EF4444); color: #fff; font-weight: 800; font-size: 19px; padding: 8px 16px; border-radius: 999px; box-shadow: 0 6px 18px rgba(249,115,22,.45); }
  .bar { height: 12px; border-radius: 99px; background: #E8E5FF; overflow: hidden; margin-bottom: 22px; }
  .bar i { display: block; width: 72%; height: 100%; background: linear-gradient(90deg,#7C3AED,#6366F1,#F97316); border-radius: 99px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 15px 16px; margin-bottom: 11px; border-radius: 18px; background: #F3F0FF; border: 2px solid #E8E5FF; font-weight: 700; font-size: 21px; }
  .row.done { background: #EDE9FF; border-color: rgba(124,58,237,.35); color: #8A86AD; text-decoration: line-through; }
  .row .ic { font-size: 26px; }
  .row .nm { flex: 1; }
  .chk { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #A78BFA; display: grid; place-items: center; }
  .done .chk { background: linear-gradient(135deg,#8B5CF6,#6366F1); border-color: transparent; }
  .chk svg { width: 18px; height: 18px; }
  .xp { font-size: 15px; font-weight: 800; color: #7C3AED; background: #EDE9FF; padding: 4px 10px; border-radius: 99px; }
  .done .xp { color: #15803D; background: rgba(34,197,94,.15); text-decoration: none; }
</style></head>
<body>
  <div class="left">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 100 100" fill="none"><path d="M28 52l16 16 28-32" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <b>Habitly</b>
    </div>
    <h1>Small ticks.<br><em>Big streaks.</em></h1>
    <p>Turn your daily habits into a game you'll actually want to play.</p>
    <span class="pill">Try it in 10 seconds · no account needed</span>
  </div>
  <div class="phone">
    <div class="top"><span class="lv">Lv. 4 · Consistent 🔥</span><span class="streak">🔥 12 day streak</span></div>
    <div class="bar"><i></i></div>
    <div class="row done"><span class="ic">💧</span><span class="nm">Drink water</span><span class="xp">✓ +25</span><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
    <div class="row done"><span class="ic">📖</span><span class="nm">Read 10 pages</span><span class="xp">✓ +25</span><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
    <div class="row"><span class="ic">🤸</span><span class="nm">5-min stretch</span><span class="xp">+25 XP</span><span class="chk"></span></div>
  </div>
</body></html>
